name: Shared Plugin Deploy to S3

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Build Plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # - name: Debug OIDC claims
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const token = await core.getIDToken('sts.amazonaws.com');
      #       const p = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
      #       core.info(JSON.stringify({ iss: p.iss, aud: p.aud, sub: p.sub }, null, 2));

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::033541889046:role/PluginsS3DeployRole
          aws-region: sa-east-1

      - name: Upload to S3
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          aws s3 cp dist/plugin.js s3://plugins.zenerp.app.br/$REPO_NAME/plugin.js --cache-control "max-age=60" --content-type "text/javascript; charset=utf-8"
