name: Deploy Plugin to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # - name: Debug OIDC claims
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const token = await core.getIDToken('sts.amazonaws.com');
      #       const p = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
      #       core.info(JSON.stringify({ iss: p.iss, aud: p.aud, sub: p.sub }, null, 2));

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::033541889046:role/GitHubActionsPluginsS3DeployRole
          aws-region: sa-east-1

      - name: Upload to S3
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          aws s3 cp dist/plugin.js s3://plugins.zenerp.app.br/$REPO_NAME/plugin.js --cache-control "max-age=60" --content-type "text/javascript; charset=utf-8"
